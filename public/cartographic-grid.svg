<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <!-- Lignes de grille principales -->
  <line x1="0" y1="0" x2="80" y2="0" stroke="#0ea5e9" stroke-width="0.8"/>
  <line x1="0" y1="40" x2="80" y2="40" stroke="#0ea5e9" stroke-width="0.4"/>
  <line x1="0" y1="0" x2="0" y2="80" stroke="#0ea5e9" stroke-width="0.8"/>
  <line x1="40" y1="0" x2="40" y2="80" stroke="#0ea5e9" stroke-width="0.4"/>
  <!-- Tirets de graduation sur lignes principales -->
  <line x1="20" y1="0" x2="20" y2="5" stroke="#0ea5e9" stroke-width="0.8"/>
  <line x1="60" y1="0" x2="60" y2="5" stroke="#0ea5e9" stroke-width="0.8"/>
  <line x1="0" y1="20" x2="5" y2="20" stroke="#0ea5e9" stroke-width="0.8"/>
  <line x1="0" y1="60" x2="5" y2="60" stroke="#0ea5e9" stroke-width="0.8"/>
  <!-- Tirets de graduation sur lignes secondaires -->
  <line x1="20" y1="40" x2="20" y2="44" stroke="#0ea5e9" stroke-width="0.5"/>
  <line x1="60" y1="40" x2="60" y2="44" stroke="#0ea5e9" stroke-width="0.5"/>
  <line x1="40" y1="20" x2="44" y2="20" stroke="#0ea5e9" stroke-width="0.5"/>
  <line x1="40" y1="60" x2="44" y2="60" stroke="#0ea5e9" stroke-width="0.5"/>
  <!-- Marqueurs aux intersections majeures -->
  <circle cx="0" cy="0" r="1.5" fill="#0ea5e9"/>
  <circle cx="40" cy="0" r="1" fill="#0ea5e9"/>
  <circle cx="0" cy="40" r="1" fill="#0ea5e9"/>
  <circle cx="40" cy="40" r="1.5" fill="#0ea5e9"/>
</svg>
